# CI/CD do agente de triagem — Exercício 13 (docs/empacotamento.md §6).
#
#   seguranca ─┐
#              ├─> imagem (build, smoke test na própria imagem; publica no GHCR
#   testes ────┤            só em push na master: tags <sha> e latest)
#              └─> eval   (modelo real; só fora de pull request e se o secret
#                          GROQ_API_KEY existir)
#
# Actions de terceiros: só checkout e setup-python, fixadas pelo SHA do
# commit (a tag é ponteiro móvel). hadolint e Trivy rodam pela imagem
# oficial com versão fixada — o mesmo comando roda local (docs/evidencias/).

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seguranca:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
      - name: hadolint (Dockerfile) — falha em achado de severidade error
        run: docker run --rm -i hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e hadolint --failure-threshold error - < Dockerfile
      - name: Trivy config — falha em achado HIGH ou CRITICAL
        run: >
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
          config --skip-check-update --exit-code 1 --severity HIGH,CRITICAL /src

  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: testes offline (sem chave, sem rede)
        run: python -m pytest -v

  eval:
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: eval (6 casos; trancamento 2/2 e total >= 5/6)
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::secret GROQ_API_KEY ausente — eval pulado, não reprovado"
            exit 0
          fi
          python -m pytest -m eval -v -s

  imagem:
    needs: [seguranca, testes]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
      - name: build (uma vez; o mesmo artefato é testado e publicado)
        run: docker build -t agente:${{ github.sha }} .
      - name: smoke test na própria imagem
        run: |
          test "$(docker run --rm agente:${{ github.sha }} id -u)" != "0"
          docker run --rm agente:${{ github.sha }} sh -c 'test ! -e /app/.env'
          docker run -d --name smoke -p 8000:8000 -e OPENAI_API_KEY=sem-uso agente:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs localhost:8000/saude && break; sleep 1; done
          curl -fs localhost:8000/saude | grep -q '"ok":true'
          docker rm -f smoke
      - name: publicar no GHCR (só push na master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGEM="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag agente:${{ github.sha }} "$IMAGEM:${{ github.sha }}"
          docker tag agente:${{ github.sha }} "$IMAGEM:latest"
          docker push "$IMAGEM:${{ github.sha }}"
          docker push "$IMAGEM:latest"
